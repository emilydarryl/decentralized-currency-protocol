[package]
name = "soveroot-sv2-independent-miner"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
async-channel = "1.9.0"
binary_sv2 = { git = "https://github.com/stratum-mining/stratum", rev = "0b083ab9411a8a4c74421e90134b77410759b6df", package = "binary_sv2" }
codec_sv2 = { git = "https://github.com/stratum-mining/stratum", rev = "0b083ab9411a8a4c74421e90134b77410759b6df", package = "codec_sv2", features = ["noise_sv2"] }
key-utils = { git = "https://github.com/stratum-mining/stratum", rev = "0b083ab9411a8a4c74421e90134b77410759b6df", package = "key-utils" }
network_helpers_sv2 = { git = "https://github.com/stratum-mining/stratum", rev = "0b083ab9411a8a4c74421e90134b77410759b6df", package = "network_helpers_sv2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.9.9"
tokio = { version = "1.44.1", features = ["full"] }

[profile.release]
strip = true
lto = "thin"
