name: PoW v1 bounded first reconstruction

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Reconstruction profile
        required: true
        default: standard
        type: choice
        options:
          - smoke
          - standard
      seeds:
        description: Deterministic seed count (1-128)
        required: true
        default: "8"
        type: string

permissions:
  contents: read

jobs:
  reconstruction:
    name: One-miss bounded reconstruction
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PROFILE: ${{ inputs.profile }}
      SEEDS: ${{ inputs.seeds }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Compile standalone v1 research executable
        shell: bash
        run: |
          mkdir -p build
          c++ -std=c++20 -O2 -Wall -Wextra -Werror \
            contrib/pow_research_cpp/powvm_v1.cpp -o build/powvm_v1_cpp

      - name: Verify independent reconstruction boundaries
        shell: bash
        run: |
          python3 -m unittest test.pow_research.test_bounded_reconstruction_v1
          python3 test/pow_research/run_cpp_bounded_reconstruction_vectors_v1.py \
            --binary build/powvm_v1_cpp

      - name: Collect reconstruction matrix
        shell: bash
        run: |
          python3 contrib/pow_research_cpp/bounded_reconstruction_v1.py \
            --profile "$PROFILE" \
            --seeds "$SEEDS" \
            --source-revision "$GITHUB_SHA" \
            --output build/pow-v1-bounded-first-reconstruction.json
          python3 -m json.tool build/pow-v1-bounded-first-reconstruction.json >/dev/null

      - name: Render reconstruction report
        shell: bash
        run: |
          python3 contrib/pow_research_cpp/render_bounded_reconstruction_report_v1.py \
            --matrix build/pow-v1-bounded-first-reconstruction.json \
            --method contrib/pow_research_v1/bounded_reconstruction_v0.json \
            --label "GitHub Ubuntu shared runner $GITHUB_RUN_ID" \
            --output build/pow-v1-bounded-first-reconstruction.md

      - name: Preserve raw matrix and report
        uses: actions/upload-artifact@v7
        with:
          name: pow-v1-bounded-first-reconstruction-${{ github.run_id }}
          path: |
            build/pow-v1-bounded-first-reconstruction.json
            build/pow-v1-bounded-first-reconstruction.md
          if-no-files-found: error
          retention-days: 14
