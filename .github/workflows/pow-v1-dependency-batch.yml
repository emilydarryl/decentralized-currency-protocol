name: PoW v1 dependency and batch screen

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Diagnostic profile
        required: true
        default: standard
        type: choice
        options:
          - smoke
          - standard
      seeds:
        description: Deterministic seed count (1-128)
        required: true
        default: "8"
        type: string

permissions:
  contents: read

jobs:
  dependency-batch:
    name: Informational dependency and batch diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PROFILE: ${{ inputs.profile }}
      SEEDS: ${{ inputs.seeds }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Compile standalone v1 research executable
        shell: bash
        run: |
          mkdir -p build
          c++ -std=c++20 -O2 -Wall -Wextra -Werror \
            contrib/pow_research_cpp/powvm_v1.cpp -o build/powvm_v1_cpp

      - name: Verify canonical and traced outputs
        shell: bash
        run: |
          python3 test/pow_research/run_cpp_vectors_v1.py --binary build/powvm_v1_cpp
          python3 test/pow_research/run_cpp_trace_vectors_v1.py --binary build/powvm_v1_cpp

      - name: Collect dependency traces
        shell: bash
        run: |
          python3 contrib/pow_research_cpp/dependency_trace_v1.py \
            --binary build/powvm_v1_cpp \
            --profile "$PROFILE" \
            --seeds "$SEEDS" \
            --source-revision "$GITHUB_SHA" \
            --output build/pow-v1-dependency-trace.json

      - name: Measure sequential batch amortization
        shell: bash
        run: |
          python3 contrib/pow_research_cpp/batch_amortization_v1.py \
            --binary build/powvm_v1_cpp \
            --profile "$PROFILE" \
            --seeds "$SEEDS" \
            --source-revision "$GITHUB_SHA" \
            --output build/pow-v1-batch-amortization.json

      - name: Render informational diagnostic report
        shell: bash
        run: |
          python3 contrib/pow_research_cpp/render_dependency_batch_report_v1.py \
            --trace build/pow-v1-dependency-trace.json \
            --batch build/pow-v1-batch-amortization.json \
            --gates contrib/pow_research/gates_v0.json \
            --method contrib/pow_research_v1/dependency_batch_screen_v0.json \
            --label "GitHub Ubuntu shared runner $GITHUB_RUN_ID" \
            --output build/pow-v1-dependency-batch-report.md
          python3 -m json.tool build/pow-v1-dependency-trace.json >/dev/null
          python3 -m json.tool build/pow-v1-batch-amortization.json >/dev/null

      - name: Preserve raw matrices and report
        uses: actions/upload-artifact@v7
        with:
          name: pow-v1-dependency-batch-${{ github.run_id }}
          path: |
            build/pow-v1-dependency-trace.json
            build/pow-v1-batch-amortization.json
            build/pow-v1-dependency-batch-report.md
          if-no-files-found: error
          retention-days: 14
