name: PoW v1 budgeted cache lower-bound screen

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Trace profile
        required: true
        default: standard
        type: choice
        options:
          - smoke
          - standard
      seeds:
        description: Deterministic seed count (1-128)
        required: true
        default: "8"
        type: string

permissions:
  contents: read

jobs:
  budgeted-cache:
    name: Metadata-aware cache lower bound
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PROFILE: ${{ inputs.profile }}
      SEEDS: ${{ inputs.seeds }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Compile standalone v1 research executable
        shell: bash
        run: |
          mkdir -p build
          c++ -std=c++20 -O2 -Wall -Wextra -Werror \
            contrib/pow_research_cpp/powvm_v1.cpp -o build/powvm_v1_cpp

      - name: Verify ordinary and traced outputs
        shell: bash
        run: |
          python3 test/pow_research/run_cpp_vectors_v1.py --binary build/powvm_v1_cpp
          python3 test/pow_research/run_cpp_trace_vectors_v1.py --binary build/powvm_v1_cpp

      - name: Collect budgeted cache matrix
        shell: bash
        run: |
          python3 contrib/pow_research_cpp/budgeted_cache_screen_v1.py \
            --binary build/powvm_v1_cpp \
            --profile "$PROFILE" \
            --seeds "$SEEDS" \
            --source-revision "$GITHUB_SHA" \
            --output build/pow-v1-budgeted-cache-matrix.json
          python3 -m json.tool build/pow-v1-budgeted-cache-matrix.json >/dev/null

      - name: Render lower-bound report
        shell: bash
        run: |
          python3 contrib/pow_research_cpp/render_budgeted_cache_report_v1.py \
            --matrix build/pow-v1-budgeted-cache-matrix.json \
            --method contrib/pow_research_v1/budgeted_cache_screen_v0.json \
            --label "GitHub Ubuntu shared runner $GITHUB_RUN_ID" \
            --output build/pow-v1-budgeted-cache-report.md

      - name: Preserve raw matrix and report
        uses: actions/upload-artifact@v7
        with:
          name: pow-v1-budgeted-cache-${{ github.run_id }}
          path: |
            build/pow-v1-budgeted-cache-matrix.json
            build/pow-v1-budgeted-cache-report.md
          if-no-files-found: error
          retention-days: 14
