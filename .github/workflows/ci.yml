# Cost-controlled CI for the development repository.
#
# The full upstream Bitcoin Core matrix is intentionally not run here. It is
# designed for bitcoin/bitcoin's public CI infrastructure and would duplicate
# macOS, Windows, cross-build, and fuzz jobs in this experimental fork.

name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-unit:
    name: Linux build and focused tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # The intentionally unmodified Bitcoin Core import. Its pre-existing
      # whitespace is outside this project's review scope.
      UPSTREAM_BASELINE_COMMIT: 3bcc424bb60c76d5679c570945c816cf2b752ae0

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check changed-file whitespace
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_commit="${{ github.event.pull_request.base.sha }}"
            if ! git merge-base --is-ancestor "$UPSTREAM_BASELINE_COMMIT" "$base_commit"; then
              echo "Bootstrap PR detected; excluding the unmodified upstream import."
              base_commit="$UPSTREAM_BASELINE_COMMIT"
            fi
            git diff --check "$base_commit"...HEAD
          else
            git diff --check HEAD^
          fi

      - name: Run non-consensus PoW research tests
        shell: bash
        run: python3 -m unittest discover -s test/pow_research -p 'test_*.py'

      - name: Run labnet mining-autonomy tests
        shell: bash
        run: python3 -m unittest discover -s test/mining_autonomy -p 'test_*.py'

      - name: Build and test pinned Stratum V2 Job Declaration helper
        shell: bash
        run: |
          cargo test --locked --release --manifest-path contrib/mining_autonomy/sv2-reference/Cargo.toml
          cargo build --locked --release --manifest-path contrib/mining_autonomy/sv2-reference/Cargo.toml

      - name: Build and test independent miner implementation
        shell: bash
        run: |
          cargo test --locked --release --manifest-path contrib/mining_autonomy/sv2-independent-miner/Cargo.toml
          cargo build --locked --release --manifest-path contrib/mining_autonomy/sv2-independent-miner/Cargo.toml

      - name: Exercise authenticated Stratum V2 accept and fallback paths
        shell: bash
        env:
          SOVEROOT_SV2_HELPER: ${{ github.workspace }}/contrib/mining_autonomy/sv2-reference/target/release/soveroot-sv2-reference
        run: python3 -m unittest discover -s test/mining_autonomy -p 'test_sv2_reference_integration.py' -v

      - name: Exercise cross-implementation authentication and rejection paths
        shell: bash
        env:
          SOVEROOT_SV2_HELPER: ${{ github.workspace }}/contrib/mining_autonomy/sv2-reference/target/release/soveroot-sv2-reference
          SOVEROOT_SV2_INDEPENDENT_MINER: ${{ github.workspace }}/contrib/mining_autonomy/sv2-independent-miner/target/release/soveroot-sv2-independent-miner
        run: python3 -m unittest discover -s test/mining_autonomy -p 'test_sv2_interoperability.py' -v

      - name: Produce byte-level mining interoperability evidence
        shell: bash
        run: |
          mkdir -p build
          python3 contrib/mining_autonomy/run_interoperability.py \
            --reference-helper contrib/mining_autonomy/sv2-reference/target/release/soveroot-sv2-reference \
            --independent-miner contrib/mining_autonomy/sv2-independent-miner/target/release/soveroot-sv2-independent-miner \
            --reference-miner contrib/mining_autonomy/autonomous_labnet_miner.py \
            --fixture contrib/mining_autonomy/vectors/sv2_interoperability_v0.json \
            --output build/sv2-interoperability-evidence.json
          python3 -c "import json; d=json.load(open('build/sv2-interoperability-evidence.json')); assert d['all_exact_results_match']; assert all(d['comparisons'].values())"

      - name: Retain mining interoperability evidence
        uses: actions/upload-artifact@v4
        with:
          name: sv2-miner-interoperability-${{ github.run_id }}
          path: build/sv2-interoperability-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Check Labnet Kit helper scripts
        shell: bash
        run: |
          bash -n contrib/labnet-kit/soveroot-labnet
          bash -n contrib/labnet-kit/package-linux.sh
          contrib/labnet-kit/soveroot-labnet help | grep -F -- "local test-only node"
          contrib/labnet-kit/soveroot-labnet help | grep -F -- "autonomy-demo"
          contrib/labnet-kit/soveroot-labnet help | grep -F -- "coordinator-failure-demo"
          contrib/labnet-kit/soveroot-labnet help | grep -F -- "job-declaration-demo"
          contrib/labnet-kit/soveroot-labnet help | grep -F -- "interoperability-demo"

      - name: Install minimal build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            cmake \
            libboost-dev \
            libevent-dev \
            help2man \
            libsqlite3-dev \
            ninja-build \
            pkgconf

      - name: Build and run independent PoW differential implementation
        shell: bash
        run: |
          mkdir -p build
          c++ -std=c++20 -O2 -Wall -Wextra -Werror \
            contrib/pow_research_cpp/powvm.cpp -o build/powvm_cpp
          python3 test/pow_research/run_cpp_vectors.py --binary build/powvm_cpp
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -fstack-usage \
            contrib/pow_research_cpp/powvm_v1.cpp -o build/powvm_v1_cpp
          python3 contrib/pow_research_cpp/verify_recursive_stack_usage_v1.py \
            build/*.su --output build/pow-v1-recursive-stack-usage.json
          python3 contrib/pow_research_cpp/verify_recursive_stack_usage_v1.py \
            build/*.su --symbol 'RecursiveRegenerator::ValueAtIterative' \
            --allowance 512 --output build/pow-v1-iterative-stack-usage.json
          python3 test/pow_research/run_cpp_vectors_v1.py --binary build/powvm_v1_cpp
          python3 test/pow_research/run_cpp_half_memory_vectors_v1.py --binary build/powvm_v1_cpp
          python3 test/pow_research/run_cpp_trace_vectors_v1.py --binary build/powvm_v1_cpp
          python3 test/pow_research/run_cpp_versioned_graph_vectors_v1.py --binary build/powvm_v1_cpp
          python3 test/pow_research/run_cpp_recomputation_vectors_v1.py --binary build/powvm_v1_cpp
          python3 test/pow_research/run_cpp_bounded_probe_vectors_v1.py --binary build/powvm_v1_cpp
          python3 test/pow_research/run_cpp_bounded_reconstruction_vectors_v1.py --binary build/powvm_v1_cpp
          python3 test/pow_research/run_cpp_repeated_reconstruction_vectors_v1.py --binary build/powvm_v1_cpp
          python3 test/pow_research/run_cpp_packed_reconstruction_vectors_v1.py --binary build/powvm_v1_cpp
          python3 test/pow_research/run_cpp_paged_gap_reconstruction_vectors_v1.py --binary build/powvm_v1_cpp
          python3 test/pow_research/run_cpp_indexed_gap_reconstruction_vectors_v1.py --binary build/powvm_v1_cpp
          python3 test/pow_research/run_cpp_time_checkpoint_screen_vectors_v1.py --binary build/powvm_v1_cpp
          python3 test/pow_research/run_cpp_recursive_regeneration_vectors_v1.py --binary build/powvm_v1_cpp
          python3 test/pow_research/run_cpp_repeated_recursive_regeneration_vectors_v1.py --binary build/powvm_v1_cpp
          python3 test/pow_research/run_cpp_checkpoint_recursive_regeneration_vectors_v1.py --binary build/powvm_v1_cpp
          python3 test/pow_research/run_cpp_target_checkpoint_regeneration_vectors_v1.py --binary build/powvm_v1_cpp
          python3 test/pow_research/run_cpp_dependency_bundle_regeneration_vectors_v1.py --binary build/powvm_v1_cpp
          python3 test/pow_research/run_cpp_operation_bounded_dependency_bundle_vectors_v1.py --binary build/powvm_v1_cpp
          python3 test/pow_research/run_cpp_physically_accounted_dependency_bundle_vectors_v1.py --binary build/powvm_v1_cpp
          python3 test/pow_research/run_cpp_iterative_work_stack_vectors_v1.py --binary build/powvm_v1_cpp
          python3 test/pow_research/run_cpp_hierarchical_checkpoint_ladder_vectors_v1.py --binary build/powvm_v1_cpp
          python3 test/pow_research/run_cpp_frontier_pebbling_attacker_vectors_v1.py --binary build/powvm_v1_cpp
          python3 contrib/pow_research_cpp/measure_physical_memory_v1.py \
            --binary build/powvm_v1_cpp --profile standard --seeds 8 \
            --operation-limit 5000000 --output build/pow-v1-physical-memory-diagnostic.json
          python3 -c "import json; d=json.load(open('build/pow-v1-physical-memory-diagnostic.json')); assert len(d['cases']) == 8; assert all(c['attacker']['physical_memory_accounting']['accounted_bytes'] == 131072 for c in d['cases'])"
          python3 contrib/pow_research_cpp/pebbling_lower_bound_v1.py \
            --profile smoke --seeds 1 --output build/pow-v1-pebbling-lower-bound-smoke.json
          python3 contrib/pow_research_cpp/render_pebbling_lower_bound_report_v1.py \
            --matrix build/pow-v1-pebbling-lower-bound-smoke.json \
            --method contrib/pow_research_v1/pebbling_lower_bound_v0.json \
            --label "CI smoke" --output build/pow-v1-pebbling-lower-bound-smoke.md
          python3 contrib/pow_research_cpp/benchmark_matrix_v1.py \
            --binary build/powvm_v1_cpp --profile smoke --output build/pow-v1-benchmark-smoke.json
          python3 contrib/pow_research_cpp/render_report_v1.py \
            --matrix build/pow-v1-benchmark-smoke.json \
            --gates contrib/pow_research/gates_v0.json \
            --screening contrib/pow_research_v1/screening_v0.json \
            --label "CI smoke" --output build/pow-v1-benchmark-smoke.md
          python3 -c "import json; d=json.load(open('build/pow-v1-benchmark-smoke.json')); assert all(set(r['median_phase_ns_across_seeds']) == {'input_setup','scratchpad_init','mix_execute','finalize'} for r in d['results'])"
          python3 contrib/pow_research_cpp/half_memory_attack_v1.py \
            --binary build/powvm_v1_cpp --profile smoke --output build/pow-v1-half-memory-smoke.json
          python3 contrib/pow_research_cpp/render_half_memory_report_v1.py \
            --matrix build/pow-v1-half-memory-smoke.json \
            --gates contrib/pow_research/gates_v0.json \
            --method contrib/pow_research_v1/half_memory_attack_v0.json \
            --label "CI smoke" --output build/pow-v1-half-memory-smoke.md
          python3 -c "import json; d=json.load(open('build/pow-v1-half-memory-smoke.json')); assert d['all_exact_outputs_match']"
          python3 contrib/pow_research_cpp/recomputation_baseline_v1.py \
            --binary build/powvm_v1_cpp --profile smoke --output build/pow-v1-recomputation-smoke.json
          python3 contrib/pow_research_cpp/render_recomputation_report_v1.py \
            --matrix build/pow-v1-recomputation-smoke.json \
            --gates contrib/pow_research/gates_v0.json \
            --method contrib/pow_research_v1/recomputation_baseline_v0.json \
            --label "CI smoke" --output build/pow-v1-recomputation-smoke.md
          python3 -c "import json; d=json.load(open('build/pow-v1-recomputation-smoke.json')); assert d['all_exact_outputs_match']; assert all(c['half_retained_full_replay']['recomputation_stats']['external_storage_bytes'] == 0 for c in d['cases'])"
          python3 contrib/pow_research_cpp/dependency_trace_v1.py \
            --binary build/powvm_v1_cpp --profile smoke --output build/pow-v1-dependency-smoke.json
          python3 contrib/pow_research_cpp/batch_amortization_v1.py \
            --binary build/powvm_v1_cpp --profile smoke --output build/pow-v1-batch-smoke.json
          python3 contrib/pow_research_cpp/render_dependency_batch_report_v1.py \
            --trace build/pow-v1-dependency-smoke.json \
            --batch build/pow-v1-batch-smoke.json \
            --gates contrib/pow_research/gates_v0.json \
            --method contrib/pow_research_v1/dependency_batch_screen_v0.json \
            --label "CI smoke" --output build/pow-v1-dependency-batch-smoke.md
          python3 contrib/pow_research_cpp/budgeted_cache_screen_v1.py \
            --binary build/powvm_v1_cpp --profile smoke --output build/pow-v1-budgeted-cache-smoke.json
          python3 contrib/pow_research_cpp/render_budgeted_cache_report_v1.py \
            --matrix build/pow-v1-budgeted-cache-smoke.json \
            --method contrib/pow_research_v1/budgeted_cache_screen_v0.json \
            --label "CI smoke" --output build/pow-v1-budgeted-cache-smoke.md
          python3 -c "import json; d=json.load(open('build/pow-v1-budgeted-cache-smoke.json')); assert all(s['offline_optimal']['materialized_read_misses']['median'] <= s['lru']['materialized_read_misses']['median'] for s in d['summaries'].values())"
          python3 contrib/pow_research_cpp/benchmark_matrix.py \
            --binary build/powvm_cpp --profile smoke --output build/pow-benchmark-smoke.json
          python3 -c "import json; d=json.load(open('build/pow-benchmark-smoke.json')); assert all(set(r['median_phase_ns_across_seeds']) == {'input_setup','scratchpad_init','vm_execute','finalize'} for r in d['results'])"

      - name: Retain physical-memory evidence
        uses: actions/upload-artifact@v4
        with:
          name: pow-v1-physical-memory-${{ github.run_id }}
          path: |
            build/pow-v1-physical-memory-diagnostic.json
            build/pow-v1-recursive-stack-usage.json
            build/pow-v1-iterative-stack-usage.json
          if-no-files-found: error

      - name: Configure focused node and test build
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DBUILD_BENCH=OFF \
            -DBUILD_BITCOIN_BIN=OFF \
            -DBUILD_CLI=ON \
            -DBUILD_DAEMON=ON \
            -DBUILD_FUZZ_BINARY=OFF \
            -DBUILD_GUI=OFF \
            -DBUILD_TX=OFF \
            -DBUILD_UTIL=OFF \
            -DENABLE_IPC=OFF \
            -DENABLE_WALLET=ON \
            -DWITH_ZMQ=OFF

      - name: Build daemon, CLI, and unit-test binary
        shell: bash
        run: cmake --build build --target bitcoind bitcoin-cli test_bitcoin --parallel 2

      - name: Verify Soveroot public binary names
        shell: bash
        run: |
          test -x build/bin/sovrd
          test -x build/bin/sovr-cli
          test ! -e build/bin/bitcoind
          test ! -e build/bin/bitcoin-cli
          build/bin/sovrd -chain=labnet -version
          build/bin/sovr-cli -chain=labnet -version

      - name: Verify fail-closed CLI chain selection
        shell: bash
        run: |
          if build/bin/sovr-cli -chain=main getblockcount 2>build/sovr-cli-main.err; then
            echo "sovr-cli unexpectedly accepted inherited mainnet selection"
            exit 1
          fi
          grep -F -- "Use -chain=labnet for isolated project development." build/sovr-cli-main.err

      - name: Verify Soveroot manual generation and installation
        shell: bash
        run: |
          mkdir -p build/generated-man build/stage
          BUILDDIR="$PWD/build" MANDIR="$PWD/build/generated-man" \
            python3 contrib/devtools/gen-manpages.py --skip-missing-binaries
          test -s build/generated-man/sovrd.1
          test -s build/generated-man/sovr-cli.1
          grep -F -- "labnet" build/generated-man/sovrd.1
          grep -F -- "labnet" build/generated-man/sovr-cli.1
          cmake --install build --prefix "$PWD/build/stage" --component bitcoind
          cmake --install build --prefix "$PWD/build/stage" --component bitcoin-cli
          test -s build/stage/share/man/man1/sovrd.1
          test -s build/stage/share/man/man1/sovr-cli.1
          test ! -e build/stage/share/man/man1/bitcoind.1
          test ! -e build/stage/share/man/man1/bitcoin-cli.1

      - name: Run project isolation unit tests
        shell: bash
        run: |
          build/bin/test_bitcoin --run_test=argsman_tests/chain_isolation_interlock
          build/bin/test_bitcoin --run_test=chainparams_tests/labnet_identity_isolated_from_bitcoin

      - name: Run two-node labnet smoke test through sovr-cli
        shell: bash
        run: build/test/functional/test_runner.py feature_labnet_smoke.py --jobs=1 --usecli

      - name: Package Linux Labnet Kit
        shell: bash
        run: contrib/labnet-kit/package-linux.sh "$PWD/build" "$PWD/build/labnet-kit-artifacts"

      - name: Exercise packaged Labnet Kit
        shell: bash
        run: |
          mkdir -p build/labnet-kit-extract
          archive="$(find build/labnet-kit-artifacts -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "$archive"
          tar -xzf "$archive" -C build/labnet-kit-extract
          kit="$(find build/labnet-kit-extract -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -x "$kit/soveroot-labnet"
          test -x "$kit/libexec/autonomous_labnet_miner.py"
          test -x "$kit/libexec/share_accounting_coordinator.py"
          test -x "$kit/libexec/soveroot-sv2-reference"
          test -x "$kit/libexec/soveroot-sv2-independent-miner"
          test -x "$kit/libexec/run_interoperability.py"
          test -s "$kit/libexec/sv2_interoperability_v0.json"
          export SOVEROOT_LABNET_HOME="$PWD/build/labnet-kit-runtime"
          cleanup() { "$kit/soveroot-labnet" stop >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          "$kit/soveroot-labnet" start
          demo_output="$("$kit/soveroot-labnet" demo)"
          printf '%s\n' "$demo_output"
          grep -F -- "Receiver balance: 1" <<<"$demo_output"
          autonomy_output="$("$kit/soveroot-labnet" autonomy-demo)"
          printf '%s\n' "$autonomy_output"
          grep -F -- "Autonomous external block accepted:" <<<"$autonomy_output"
          grep -F -- "No pool coordinator was used" <<<"$autonomy_output"
          coordinator_output="$("$kit/soveroot-labnet" coordinator-failure-demo)"
          printf '%s\n' "$coordinator_output"
          grep -F -- "Accounting coordinator stopped before the second block." <<<"$coordinator_output"
          grep -F -- "Mining continued after coordinator shutdown:" <<<"$coordinator_output"
          grep -F -- "The coordinator supplied no template and published no block." <<<"$coordinator_output"
          declaration_output="$("$kit/soveroot-labnet" job-declaration-demo)"
          printf '%s\n' "$declaration_output"
          grep -F -- "Job declaration status: accepted" <<<"$declaration_output"
          grep -F -- "Job declaration status: direct_fallback" <<<"$declaration_output"
          grep -F -- "Same miner continued in direct fallback" <<<"$declaration_output"
          interoperability_output="$("$kit/soveroot-labnet" interoperability-demo)"
          printf '%s\n' "$interoperability_output"
          grep -F -- "Reference and independent authentication and wire vectors matched byte-for-byte." <<<"$interoperability_output"
          grep -F -- "Both independently built miner-created jobs were accepted and directly published." <<<"$interoperability_output"
          "$kit/soveroot-labnet" status >/dev/null
          "$kit/soveroot-labnet" stop
          trap - EXIT

      - name: Retain Linux Labnet Kit
        uses: actions/upload-artifact@v4
        with:
          name: soveroot-labnet-kit-linux-x86_64-${{ github.run_id }}
          path: |
            build/labnet-kit-artifacts/*.tar.gz
            build/labnet-kit-artifacts/*.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
